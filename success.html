<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Success | LOGIX</title>
    
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'], serif: ['Playfair Display', 'serif'] },
                    colors: { 'logix-blue': '#005b9f', 'logix-accent': '#00e5ff', 'logix-dark': '#0a0f1c' },
                    animation: { 
                        'blob': 'blob 10s infinite', 
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite'
                    },
                    keyframes: {
                        blob: {
                            '0%': { transform: 'translate(0px, 0px) scale(1)' },
                            '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
                            '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
                            '100%': { transform: 'translate(0px, 0px) scale(1)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .glass-panel {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .text-glow { text-shadow: 0 0 30px rgba(0, 229, 255, 0.4); }
        .tilt-effect { transition: transform 0.1s ease-out; transform-style: preserve-3d; will-change: transform; }
        
        /* Smooth pure CSS countdown animation - depleting backwards (counter-clockwise) */
        @keyframes ring-deplete {
            0% { stroke-dashoffset: 0; }
            100% { stroke-dashoffset: -326.73; /* Negative offset forces counter-clockwise depletion */ }
        }
        
        .progress-ring__circle {
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
            /* 5s linear depletion that perfectly matches the time */
            animation: ring-deplete 5s linear forwards; 
        }
    </style>
</head>
<body class="font-sans text-gray-200 antialiased bg-logix-dark h-screen flex flex-col justify-center items-center relative overflow-hidden selection:bg-logix-accent selection:text-gray-900">

    <!-- Atmospheric Background -->
    <div class="absolute top-1/4 left-1/4 w-[500px] h-[500px] bg-logix-blue rounded-full mix-blend-screen filter blur-[120px] opacity-20 animate-blob"></div>
    <div class="absolute bottom-1/4 right-1/4 w-[500px] h-[500px] bg-purple-900 rounded-full mix-blend-screen filter blur-[120px] opacity-20 animate-blob" style="animation-delay: 2s;"></div>

    <div class="w-full max-w-xl px-6 z-10 perspective-1000">
        <div class="glass-panel rounded-3xl p-10 sm:p-14 text-center tilt-effect cursor-default" id="success-card">
            
            <!-- Success Icon with Animated Ring -->
            <div class="relative mx-auto w-28 h-28 mb-8 flex justify-center items-center">
                <!-- SVG Progress Ring -->
                <svg class="absolute inset-0 w-full h-full drop-shadow-[0_0_15px_rgba(0,229,255,0.5)]" width="112" height="112">
                    <!-- Background Track -->
                    <circle class="text-white/10" stroke-width="4" stroke="currentColor" fill="transparent" r="52" cx="56" cy="56"/>
                    <!-- Depleting Ring -->
                    <circle id="progress-circle" class="text-logix-accent progress-ring__circle" stroke-width="4" stroke-dasharray="326.73" stroke-dashoffset="0" stroke-linecap="round" stroke="currentColor" fill="transparent" r="52" cx="56" cy="56"/>
                </svg>
                
                <div class="absolute inset-0 rounded-full bg-logix-accent/10 animate-pulse-slow blur-md"></div>
                <div class="relative w-20 h-20 rounded-full bg-white/5 border border-logix-accent/30 flex items-center justify-center shadow-[0_0_30px_rgba(0,229,255,0.2)]">
                    <svg class="h-10 w-10 text-logix-accent" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                    </svg>
                </div>
            </div>

            <!-- Text Content -->
            <h1 class="font-serif text-4xl sm:text-5xl font-bold text-white mb-4 tracking-tight">Request <span class="text-transparent bg-clip-text bg-gradient-to-r from-white to-logix-accent text-glow">Received.</span></h1>
            <p class="text-lg text-gray-400 mb-8 font-light leading-relaxed">
                Thank you for trusting Logix with your idea. Our engineering team will review your project details and respond shortly.
            </p>

            <div class="flex flex-col items-center justify-center gap-4">
                <p class="text-sm text-gray-500 font-medium tracking-widest uppercase">Redirecting in <span id="countdown" class="text-logix-accent">5</span>s...</p>
                
                <!-- Action Button -->
                <a href="index.html" class="relative group inline-flex items-center justify-center px-8 py-3 border border-white/10 text-sm font-bold tracking-[0.1em] uppercase rounded-lg text-white bg-white/5 hover:bg-white/10 transition-all duration-300 w-full sm:w-auto overflow-hidden">
                    <span class="absolute inset-0 w-full h-full bg-gradient-to-r from-logix-blue/50 to-logix-accent/50 opacity-0 group-hover:opacity-100 transition-opacity duration-300 -z-10 blur-md"></span>
                    <svg class="w-4 h-4 mr-3 -ml-1 group-hover:-translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                    Return Now
                </a>
            </div>
        </div>
    </div>

    <!-- Footer branding -->
    <div class="absolute bottom-8 flex items-center gap-2 opacity-50">
        <img src="logo.png" alt="Logix Logo" class="h-5 w-auto invert">
        <span class="font-serif font-bold text-sm text-white tracking-widest">LOGIX</span>
    </div>

    <script>
        // Interactive 3D Tilt Effect
        const card = document.getElementById('success-card');
        document.addEventListener('mousemove', (e) => {
            const rect = card.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            const centerX = rect.width / 2;
            const centerY = rect.height / 2;
            
            if (e.clientX > rect.left - 200 && e.clientX < rect.right + 200 &&
                e.clientY > rect.top - 200 && e.clientY < rect.bottom + 200) {
                const rotateX = ((y - centerY) / centerY) * -5; 
                const rotateY = ((x - centerX) / centerX) * 5;
                card.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
            } else {
                card.style.transform = `rotateX(0deg) rotateY(0deg)`;
            }
        });

        // Redirect EXACTLY when the CSS animation finishes (no premature jumps)
        const progressCircle = document.getElementById('progress-circle');
        progressCircle.addEventListener('animationend', () => {
            window.location.href = 'index.html';
        });

        // Update the text countdown independently for visual numbers only
        let timeLeft = 5;
        const countdownElement = document.getElementById('countdown');
        const timer = setInterval(() => {
            timeLeft--;
            if (timeLeft > 0) {
                countdownElement.textContent = timeLeft;
            } else {
                clearInterval(timer);
                countdownElement.textContent = "0";
            }
        }, 1000);
    </script>
</body>
</html>
